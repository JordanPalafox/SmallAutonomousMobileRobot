# Rollers del almacén — layout REAL medido. Cajas pegadas a la pared Norte.
# Coords del usuario: x=Este, y=Norte. Cada roller se da por su extensión en X
# (x_ini..x_fin, el lado de ~17 cm) y se extiende `depth` (0.35 m) en Y desde la
# pared Norte (north_y). El world se regenera con: scripts/gen_warehouse.py
roller_height: 0.20
depth: 0.35
north_y: 4.85
rollers:
  - {name: R1, x_ini: 1.78, x_fin: 1.95}
  - {name: R2, x_ini: 2.19, x_fin: 2.36}
  - {name: R3, x_ini: 2.60, x_fin: 2.79}
  - {name: R4, x_ini: 3.01, x_fin: 3.18}
