# =============================================================================
# Mapa de marcadores ArUco de localizacion
# =============================================================================
# Frame `map` (REP-103): X adelante, Y izquierda, Z arriba.
# Markers VERTICALES (en muros / costados de obstaculos, mirando hacia la pista):
#   x, y      -> posicion del CENTRO del marker [metros]
#   z         -> altura del CENTRO sobre el piso [metros]
#   yaw_deg   -> direccion a la que MIRA la cara (su normal) [grados]
#                0 = mira +X, 90 = +Y, 180 = -X, 270 = -Y
#   mount     -> wall (vertical) | floor (plano)
#
# Editar con la GUI:  python3 src/perception/tools/aruco_map_editor.py
# Diccionario: DICT_ARUCO_ORIGINAL (5x5) | Tamano: 9 cm | Pista 3.65 x 4.85 m
# =============================================================================

