# =============================================================================
# Mapa de marcadores ArUco de localizacion
# =============================================================================
# Posicion CONOCIDA de cada marker fijo en el piso, en el frame `map`.
# La capa de localizacion (aruco_localization) usa esto para deducir la pose
# del robot a partir de los markers que ve la camara.
#
# Convencion (REP-103): frame `map` con X adelante, Y a la izquierda, Z arriba.
# Cada marker esta PLANO en el piso (z = 0, mirando hacia arriba).
#   x, y       -> posicion del CENTRO del marker en el piso [metros]
#   theta_deg  -> giro del marker alrededor del eje Z del mapa [grados]
#
# Llena esto con la GUI:  python3 src/perception/tools/aruco_map_editor.py
# (eliges el ID, haces click en el plano, Guardar -> reescribe este archivo).
#
# IDs disponibles (20, del PDF): 5 7 13 17 19 20 21 22 23 25 26 27 28 29 30 31 37 38 39 41
# Diccionario: DICT_ARUCO_ORIGINAL (rejilla 5x5) | Tamano: 9 cm de lado
# Pista: 3.67 (X) x 4.85 (Y) m
# =============================================================================

track: {x: 3.670, y: 4.850}

# Vacio: coloca los marcadores con la GUI. Quedaran asi:
#   - {id: 5, x: 1.230, y: 3.400, theta_deg: 90.0}
markers: []
