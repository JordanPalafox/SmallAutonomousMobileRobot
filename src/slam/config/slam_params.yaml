slam_node:
  ros__parameters:
    # ── Grid ─────────────────────────────────────────────────────
    # 4 cm cells — finer than the original 5 cm for crisper walls, but
    # forgiving enough that early mapping (with only 1-2 walls seen)
    # doesn't need centimetre-perfect localisation to start building.
    # 400×400 = 16×16 m, plenty for the 4.86 × 3.76 m track + margin.
    resolution:        0.04          # m/cell
    map_width:         400           # cells (16 m)
    map_height:        400           # cells (16 m)

    # Log-odds increments + clamps.
    l_occ:             0.50
    l_free:           -0.20
    l_min:            -2.0
    l_max:             4.0

    display_l_occ:     2.5           # ~5 hits to display as wall
    display_l_free:   -1.2

    # Free-ray DDA stops at walls above this threshold (~6 hits) —
    # established walls survive single-scan misalignments.
    occupied_stop:     3.0

    # ── Scan filtering / cadence ─────────────────────────────────
    range_min:         0.12
    range_max:         10.0
    ray_step:          1
    # RPLIDAR A1 per-sample quality gate (LaserScan.intensities). 0.0 = off
    # (sim publishes no intensities). On the real A1 try ~5–10 to drop
    # specular/oblique weak returns before they reach the matcher.
    scan_quality_min:  0.0
    outlier_max_jump:  0.3
    map_publish_every: 5
    base_frame:        base_link

    # LiDAR latency compensation: subtracted from the scan header.stamp before
    # looking up the odom pose to match against. The RPLIDAR A1 over serial
    # timestamps at DELIVERY, not capture, so the pose used for matching lags
    # the real one during motion → systematic drift (scan floats off the walls,
    # worst during turns). 0.04 s is a starting estimate.
    # TUNING (on the robot, in localization-only): rotate in place at a steady
    # rate and watch the scan vs the map walls in RViz — if the scan trails
    # BEHIND the walls in the direction of rotation, INCREASE this; if it leads,
    # decrease. Re-check straight-line driving after. Typical range 0.02–0.08 s.
    scan_time_offset:  0.04

    # Map-write motion gate.
    min_delta_xy:      0.02
    min_delta_theta:   0.02

    # Map-write CERTAINTY gate — only integrate when ≥ fraction of
    # particles are concentrated within the radius below.  Set to 0.0
    # to disable.
    amcl_confidence_threshold:    0.95
    amcl_confident_radius_xy:     0.15
    amcl_confident_radius_theta:  0.10

    # ── AMCL particle filter ─────────────────────────────────────
    # The Puzzlebot slips HARD on rotation, so wheel-odom yaw is the
    # least reliable measurement.  alpha1 (rot→rot) and alpha2
    # (trans→rot) are turned up a lot so the particle cloud spreads
    # in θ during turns — that lets the LiDAR pull the filter to the
    # true heading, AND it drops the AMCL certainty during the turn so
    # the integration gate stops baking smeared scans into the map.
    # With scan-to-scan ICP providing a reliable rotation prior, the
    # motion-model noise can stay moderate — the laser already corrects
    # the wheel-slip rotation before AMCL even runs.
    amcl_n_particles:           600
    amcl_alpha1:                0.05    # rot→rot noise
    amcl_alpha2:                0.05    # trans→rot
    amcl_alpha3:                0.10    # trans→trans
    amcl_alpha4:                0.03    # rot→trans
    # σ_hit = sharpness of the likelihood-field match. SMALLER = STRICTER
    # (a beam endpoint must sit closer to a wall to score well). The 0.10
    # "floor" was a MAPPING constraint — while the map is still sparse a peaky
    # model collapses all particle weights → divergence. In LOCALIZATION-ONLY
    # (preloaded complete map) that risk is gone, so 0.06 makes the scan↔wall
    # match noticeably tighter. Drop to 0.05 for stricter still; raise back
    # toward 0.10 if the filter gets twitchy or loses lock. 240 beams; bump
    # toward 360 for sharper localisation if the Jetson scan budget allows.
    amcl_sigma_hit:             0.06
    amcl_max_scan_pts:          240

    # Adaptive recovery (§4.2): when n_eff collapses below this fraction the
    # belief has lost the robot — broaden the cloud LOCALLY (not global
    # scatter) so the next scan can re-acquire. Mapping-safe.
    amcl_recovery_neff_ratio:   0.15
    amcl_recovery_sigma_xy:     0.10
    amcl_recovery_sigma_theta:  0.08

    # ── Scan-to-map ICP REFINE — pulls the published pose onto the map walls
    # after AMCL. IMPORTANT: this refine does NOT feed back into the AMCL
    # particle belief; it's a per-scan polish whose correction is DISCARDED if
    # it exceeds the caps below. So if AMCL drifts MORE than the cap, the scan
    # can never be pulled back onto the walls (it floats off — the symptom you
    # saw). The caps are raised here to give the refine authority to recover a
    # larger drift; the coarse yaw sweep is widened to grab the walls.
    scan_to_map_refine_enabled:     true
    scan_to_map_radius:             4.0     # m — wall points considered around robot
    scan_to_map_min_points:         80
    scan_to_map_reject:             0.30    # m — ICP correspondence cutoff (smaller = stricter)
    scan_to_map_max_correction:     0.30    # m   (was 0.15 — let refine pull further per scan)
    scan_to_map_max_correction_deg: 15.0    # deg (was 8 — recover larger heading drift)
    # Coarse yaw sweep before the fine ICP — rescues turns where wheel-odom yaw
    # drifted past the fine gate. Sweep ±range in `step` increments.
    scan_to_map_coarse_range_deg:   12.0    # was 6 — wider search to re-grab walls
    scan_to_map_coarse_step_deg:    1.5

    # ── Scan-to-scan ICP odometry (robust rotation prior) ────────
    scan_match_odom_enabled:    true
    scan_match_max_fitness:     0.08    # m RMS — reject bad ICP fits
    scan_match_max_jump:        0.50    # m
    scan_match_reject:          0.40    # m — ICP correspondence cutoff
    amcl_z_hit:                 0.90    # trust real wall hits more (stricter match)
    amcl_z_rand:                0.10    # less uniform tolerance for off-wall beams
    amcl_z_max_dist:            2.0
    amcl_neff_threshold_ratio:  0.5
    # CUDA particle scoring. Keep true on the dev box / if a GPU is present;
    # on the Jetson Nano benchmark CPU-vs-GPU (the per-scan likelihood-field
    # copy can cost more than CPU scoring on Maxwell) and set whatever wins.
    # The build falls back to a CPU stub automatically when no CUDA toolkit.
    amcl_use_cuda:              true

    # ── Real-time / Jetson Nano 2 GB ─────────────────────────────────
    # publish_debug: heavy RViz-only topics (/particle_cloud, /graph_markers).
    # Set false on the Nano to save CPU + WiFi; /slam_pose, /map, /slam_path
    # (everything nav needs) keep publishing.
    publish_debug:              true
    # Warn (throttled) if a single scan's processing exceeds this many ms —
    # the 10 Hz budget is 100 ms; 80 leaves headroom for the warning to be useful.
    scan_budget_ms:             80.0

    # ── ArUco = ANCLA del frame + RESCATE ───────────────────────────────
    # FASE 1 (una sola vez): cuando el mapa ya es confiable (certeza MCL >=
    # aruco_anchor_cert y el scan encaja), ANCLA todo el mapa al frame FIJO de los
    # ArUco → el mapa queda en una posición fija sin importar dónde arrancó a
    # mapear el robot (un mapa de sim y uno real cuadran, mismo frame de markers).
    # FASE 2 (ya anclado): el MCL+scan-match es el localizador PRINCIPAL/PRECISO;
    # el ArUco solo RESCATA cuando el scan deja de encajar con las paredes de forma
    # SOSTENIDA. Con buen encaje, el ArUco se IGNORA (cero disrupción).
    # Requiere aruco_origin_in_map=[0,0,0] en el launch (frame map = frame markers).
    aruco_enabled:              true
    aruco_anchor_cert:          0.4     # certeza MCL mínima para ANCLAR (el scan_fits es el gate real; el AMCL tope ~0.52 en este sim)
    aruco_anchor_min_kf:        5       # keyframes mínimos para anclar (robot ya recorrió trayectoria)
    aruco_anchor_min_cells:     400     # celdas ocupadas mínimas (ya hay contorno) para anclar
    # ANCLAJE MULTI-MARKER (Umeyama): en vez de anclar desde UN fix fusionado (frágil,
    # un marker malo rotaba todo el mapa), acumula markers DISTINTOS vistos en el
    # tiempo (posición en base_link + posición canónica que manda el nodo aruco por
    # /aruco_markers) y ajusta una transformación rígida 2D con rechazo de outliers.
    aruco_anchor_min_markers:   3       # ids DISTINTOS mínimos para INTENTAR ajustar
    aruco_anchor_min_inliers:   3       # inliers MÍNIMOS tras el ajuste. ≥3 evita el fit degenerado de 2 puntos
                                        #   (causa del mapa rotado ~18°). Robustez a 1 outlier ⇒ se necesitan ≥4 vistos.
    aruco_obs_max_age:          120.0   # s — la obs se guarda RELATIVA al keyframe (sigue loop-closure, no deriva),
                                        #   así la ventana puede ser larga: junta markers de TODA una vuelta.
    aruco_obs_max_range:        2.0     # m — ignora markers lejanos (bearing ruidoso); espeja max_range del nodo aruco
    aruco_anchor_inlier_tol:    0.15    # m — residuo por marker por encima = outlier (un marker mal mapeado cae a metros)
    aruco_anchor_max_residual:  0.12    # m — RMS final del ajuste por encima = rechaza (buen ajuste multi-marker ~<0.1)
    aruco_anchor_min_baseline:  0.5     # m — GATE GEOMÉTRICO PRINCIPAL: máxima distancia entre observaciones inlier.
                                        #   La rotación es sensible al ruido ≈ ruido/baseline → el incidente (baseline 0.3 m) dio 18°.
                                        #   0.5 m lo rechaza; todos los pares canónicos reales están a ≥0.6 m, así que no descarta sets válidos.
    aruco_anchor_min_spread:    0.05    # m — SOLO piso anti-degenerado (puntos casi coincidentes). NO es el gate de colinealidad:
                                        #   markers colineales con baseline LARGO SÍ anclan bien (la rotación queda determinada por el baseline).
    aruco_track_x:              4.85    # m — ancho pista canónica SIM (aruco_map_sim 4.85×3.65). Robot real va girado → override.
    aruco_track_y:              3.65    # m — alto pista canónica SIM
    aruco_anchor_bounds_margin: 0.50    # m — margen permitido fuera de la pista antes de RECHAZAR el anclaje
    aruco_rescue_fit:           0.15    # map_fit por encima = "el scan NO encaja" (integ_max_fit=0.10). ↓ = más sensible
    aruco_rescue_fit_count:     5       # scans malos SEGUIDOS antes de rescatar. ↑ = rescate MÁS LENTO/conservador
    aruco_max_sigma_xy:         0.30    # m   — NO rescatar hacia un fix incierto (marker lejano/único)
    aruco_min_interval:         1.0     # s   — mínimo entre rescates
    aruco_seed_sigma_xy:        0.20    # m   — dispersión al re-sembrar (el scan afina desde ahí)
    aruco_seed_sigma_theta:     0.10    # rad
    # aruco_global_init OPCIONAL: si true, el PRIMER ArUco bootstrapea la pose
    # entera (para colocar el robot a ciegas sin pose inicial).
    aruco_global_init:          false
    # Params NO usados en modo rescate-por-encaje (se dejan por compatibilidad):
    aruco_cert_thresh:          0.5
    aruco_cert_rxy:             0.15
    aruco_cert_rth:             0.10
    aruco_gain:                 0.25
    aruco_max_jump:             1.0
    aruco_snap_tol:             0.15
    aruco_snap_tol_theta:       0.15

    # ── Initial pose (world frame) ───────────────────────────────
    initial_x:                  0.0
    initial_y:                  0.0
    initial_theta:              0.0
    initial_sigma_xy:           0.05
    initial_sigma_theta:        0.02
    tf_smoothing_alpha:         0.7
