lifting_node:
  ros__parameters:
    # HAL backend: mock | jetson | spi
    hal: spi

    # ── GPIO (jetson) ────────────────────────────────────────────────
    # 3-bit binary encoding → FPGA on board pin numbers
    pin_bit0: 11   # LSB
    pin_bit1: 13
    pin_bit2: 15   # MSB

    # ── SPI (Tang Nano 20K) ──────────────────────────────────────────
    # /dev/spidev<bus>.<device>; 1MHz, mode 0 (CPOL=0, CPHA=0)
    # Jetson Nano: bus 0 = pines 19/21/23/24 (header); bus 1 = pines 37/22/13/18.
    spi_bus: 0
    spi_device: 0
    spi_speed_hz: 1000000
    spi_mode: 0

    # Named operational levels (informational). Both HALs are now 3-bit,
    # but the FPGA only implements 6 positions, so the usable range is
    # 0-5 (000-101) regardless of backend. The FPGA maps each level to a
    # servo angle (level → angle): 0→95°, 1→70°, 2→65°, 3→40°, 4→25°, 5→0°.
    level_rest: 0         # idle / powered off (95°)
    level_transport: 1    # travelling with loaded pallet (70°)
    level_pick_floor: 3   # pick pallet from floor / roller (40°)
    level_carry: 4        # carrying height (25°)
    level_pick_rack2: 5   # pick pallet from rack level 2 (0°)
    level_max: 5          # maximum height (101)
